[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revprobe"
version = "0.1.0"
description = "Generate version-aware regression probes for AI knowledge assistants"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "RevProbe contributors"}]
keywords = ["rag", "evaluation", "llm", "regression-testing", "document-versioning"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
revprobe = "revprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
