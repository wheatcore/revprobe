name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: revprobe generate --old examples/policy-old.md --new examples/policy-new.md --output /tmp/revprobe-suite.json
